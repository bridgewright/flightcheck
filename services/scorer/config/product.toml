# flightcheck v0.1 product configuration (Plan 2, Task 1).
# Models and thresholds are config, not hardcode; loaded by
# scorer.config.load_product_config(). Vendor split is deliberate:
# the golden-triplet generator (gpt-5.1) is a different vendor from the
# judge (gemini-2.5-flash) to block self-preference in evals.

[models]
interviewer = "gpt-realtime"
scorer = "gemini-2.5-flash"
triplet_generator = "gpt-5.1"

[session]
budget_minutes = 20
hard_cut_minutes = 25
silence_duration_ms = 900

[delivery]
fillers = ["uh", "um", "erm", "hmm", "you know", "i mean", "sort of", "kind of", "like"]

[eligibility]
# F-04 scoring-eligibility floors (defaults proposed 2026-08-03, DECISIONS
# entry pending). Below any min_* floor the session ends "insufficient":
# no judge spend, no report, slot preserved. At or above every min_* floor
# but below any full_* bar, the report compiles with eligibility="limited".
min_duration_s = 600.0
min_candidate_turns = 5
min_candidate_words = 200
full_duration_s = 900.0
full_candidate_words = 600

[report]
ready_overall = 4.0
ready_min_dimension = 3.0
approaching_overall = 3.0
forbidden_patterns = ["nervous", "anxious", "scared", "you felt", "you were afraid", "you were feeling", "panicked", "insecure"]
