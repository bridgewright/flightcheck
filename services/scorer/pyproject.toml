[project]
name = "scorer"
version = "0.0.1"
description = "flightcheck scoring worker + eval harnesses"
requires-python = ">=3.12"
dependencies = [
  "websockets>=15",
  "google-genai>=1.20",
  "openai>=1.90",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "numpy>=2",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]
