[project]
name = "scorer"
version = "0.8.0"
description = "flightcheck scoring worker + eval harnesses"
# SPDX expression only. The LICENSE file itself lives at the repo root, above
# this project directory, so `license-files` cannot reach it (hatchling drops
# out-of-tree paths without an error) — the field is left off rather than set
# to something that silently does nothing.
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "websockets>=15",
  "google-genai>=2.14",
  "openai>=1.90",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "numpy>=2",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.28",
  "pydantic>=2.13.4",
  "supabase>=2.31.0",
  "beautifulsoup4>=4.15.0",
  "pypdf>=6.14.2",
  "librosa>=0.11.0",
  "fastapi>=0.140.0",
  "uvicorn>=0.51.0",
  "sentry-sdk>=2.66.1",
]

[project.scripts]
scorer-evals = "scorer.evals_l3.regression:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit and small: correctness (E/F), one import order (I), no legacy syntax
# (UP), ruff's own footguns (RUF), and blanket excepts (BLE) — which this repo
# does need in probe read loops, so each one must be justified with a noqa
# rather than silently allowed.
select = ["E", "F", "I", "UP", "RUF", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["scorer", "fakes", "factories", "backfill_transcripts",
                     "purge_user", "backup_corpus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tools/ holds manual operator scripts (not part of the scorer package);
# on the path so their offline pieces stay unit-testable.
pythonpath = ["tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorer"]
