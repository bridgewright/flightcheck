dimension: ai-product-strategy-judgment
question: Given our company's goal to increase customer engagement by 30%, what would
  you do? Where would you deploy an AI solution, and how would you prove it was a
  better approach than a non-AI solution?
answers:
  A: 'To hit a 30% increase in customer engagement, I would focus on adding AI across
    the product experience. I’d start by building an AI assistant powered by an LLM
    that can talk to users, answer any questions they have, and proactively recommend
    features or content. This should keep users in the product longer and make it
    feel smarter and more interactive.


    I’d also use AI to automatically personalize the entire experience: dynamic homepages,
    AI-generated tips, and auto-written notifications and emails tailored to each
    user. The more AI we use, the more relevant everything will be.


    To prove it’s better than a non-AI approach, I’d track standard metrics like engagement
    and retention before and after rolling out the AI features. If we see engagement
    go up by around 30%, that shows the AI worked. Since AI can learn over time and
    get better, I’d prioritize it rather than spending time on manual or rules-based
    alternatives.'
  B: 'I’d start by defining the 30% engagement goal in measurable terms, like increasing
    weekly active users or key feature usage. Then I’d look at the main friction points:
    onboarding drop-off, customers not discovering features, or low repeat usage.


    My instinct would be to use AI for personalization. For example, an AI-based recommendation
    system that suggests the next best action or content based on user behavior, and
    an AI chatbot or assistant inside the product to answer questions and guide users.
    I’d also consider AI-optimized notification timing and messaging.


    I’d compare this to simpler approaches like static onboarding flows, rules-based
    recommendations, and standard email sequences. We can A/B test AI-driven journeys
    against these baselines, looking at uplift in activation, session frequency, and
    retention.


    I’m aware there’s a trade-off: AI systems are more complex and costly to build
    and maintain, and may introduce latency or accuracy issues. If the uplift in engagement
    versus a rules-based system is small, we might opt for the simpler approach, but
    my expectation is that AI-driven personalization will outperform.'
  C: 'First I’d clarify what “engagement +30%” means: daily active usage, session
    length, feature adoption, or revenue-linked actions. Let’s say it’s 30% more weekly
    active customers performing a core action.


    I’d map the journey: awareness → onboarding → first success → habit. Then I’d
    test non-AI levers first: better notifications, streamlined flows, clearer value
    messaging, and targeted lifecycle campaigns.


    Where AI makes sense is in personalization at scale. For example:

    - A recommendation engine for content or actions, tuned to customer segment and
    recent behavior.

    - An LLM-powered in-product assistant that helps customers discover features and
    complete tasks faster.


    I’d run A/B tests against strong non-AI baselines: manually curated recommendations,
    simple rules-based triggers, and static onboarding flows. Success metrics: lift
    in weekly active users, task completion rate, and retention; guardrails: response
    latency, support tickets, and operational cost.


    I’d also quantify trade-offs: if an LLM assistant improves engagement 20% but
    costs 5x more per interaction than a rules engine that lifts 15%, maybe we restrict
    the LLM to high-value segments or complex journeys. The goal is maximizing net
    business impact, not just shipping AI.'
ranking:
- C
- B
- A
notes: 'C sets a measurable definition of the goal, tests non-AI levers first, names
  strong baselines and guardrail metrics, and quantifies the cost/impact trade-off
  ("maximizing net business impact, not just shipping AI"). B defines the goal
  measurably and considers baselines but presumes AI-driven personalization wins.
  A treats "more AI" as the strategy, uses only before/after observation with no
  baseline, and dismisses non-AI alternatives outright.'
