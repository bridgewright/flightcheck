<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" aria-hidden="true">
  <!--
    The hero cloud.

    The reference (ode.com) opens on a large soft pink form with a long
    tapering tail. It is drawn there as an image, which is why a scan of its
    computed styles found no CSS gradient and an earlier pass here wrongly
    concluded it had no background field at all.

    Built from radial gradients painted into rotated ellipses rather than from
    a Gaussian blur filter. A first version used feGaussianBlur and rendered
    nothing at all as a CSS background image: the file served, the browser
    fetched it, and no pixel appeared. Rather than keep guessing at the filter
    region, the softness is now in the paint itself, which has no such failure
    mode. Rotating an ellipse filled with a radial gradient also gives the
    taper, which layered CSS radial-gradients cannot: a CSS radial gradient is
    always symmetric about its own centre.

    Explicit width and height, and no preserveAspectRatio. Both were present in
    an earlier version and the image rendered nothing at all as a CSS
    background: the file served 200, the browser fetched it, and no pixel
    appeared, while a solid colour on the same box painted fine. An SVG with a
    viewBox but no intrinsic size, asked to `slice`, has no reliable default
    size as a background image. Giving it real dimensions and letting
    background-size: cover do the cropping removes the ambiguity, and the
    cropping was what `slice` was for anyway.

    About 1 KB, scales to any viewport, colour editable in one place, and no
    non-MIT binary in a repository whose licence is one of its release gates.

    The colour is the bloom token (#edc9d8) in app/globals.css. If that token
    moves, this file moves with it; there is no third place to check.
  -->
  <defs>
    <radialGradient id="soft">
      <stop offset="0%" stop-color="#edc9d8" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#edc9d8" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#edc9d8" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#edc9d8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- The head, high and right of centre, where the reference puts its mass. -->
  <ellipse cx="1010" cy="290" rx="430" ry="300" fill="url(#soft)" />
  <!-- The tail, rotated so the form reads as drifting rather than as a blob. -->
  <ellipse cx="660" cy="400" rx="620" ry="185" fill="url(#soft)" opacity="0.75"
           transform="rotate(-12 660 400)" />
  <!-- A third, fainter and lower left, so the falloff is not symmetrical. -->
  <ellipse cx="300" cy="470" rx="420" ry="230" fill="url(#soft)" opacity="0.45"
           transform="rotate(-7 300 470)" />
</svg>
