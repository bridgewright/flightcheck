<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <!--
    The hero cloud.

    The reference (ode.com) opens on a large soft pink form with a long tapering
    tail. It is drawn there as an image, which is why a scan of its computed
    styles found no CSS gradient and an earlier pass here wrongly concluded it
    had no background field at all.

    This is that shape, as geometry rather than as a photograph: three ellipses
    at different angles and opacities, blurred hard enough that no edge of any
    one of them is findable. Layered CSS radial gradients cannot make the taper,
    because a radial gradient is always symmetric about its own centre; rotating
    an ellipse and blurring it can.

    Kept as an SVG rather than a raster: it is about 1 KB, it scales to any
    viewport without a second asset, its colour is editable in one place, and it
    adds no non-MIT binary to a repository whose licence is one of its twelve
    release gates.

    The colour is --color-bloom (#edc9d8) from app/globals.css. If that token
    moves, this file moves with it; there is no third place to check.
  -->
  <defs>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="96" />
    </filter>
  </defs>
  <g filter="url(#soften)" fill="#edc9d8">
    <!-- The head, high and right of centre, where the reference puts its mass. -->
    <ellipse cx="1010" cy="300" rx="300" ry="205" opacity="0.85" />
    <!-- The tail, rotated so the form reads as drifting rather than as a blob. -->
    <ellipse cx="640" cy="410" rx="470" ry="120" opacity="0.6" transform="rotate(-13 640 410)" />
    <!-- A third, fainter and lower left, so the falloff is not symmetrical. -->
    <ellipse cx="330" cy="470" rx="290" ry="150" opacity="0.35" transform="rotate(-8 330 470)" />
  </g>
</svg>
